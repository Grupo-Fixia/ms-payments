apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-payments
  namespace: apps
  labels:
    app: ms-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-payments
  template:
    metadata:
      labels:
        app: ms-payments
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ms-payments
      containers:
        - name: ms-payments
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-payments-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: ConnectionStrings__PaymentsDb
              value: "Host=postgres.data.svc.cluster.local;Port=5432;Database=ms_payments;Username=ms_payments;Password=$(SPRING_DATASOURCE_PASSWORD)"
            - name: Kafka__BootstrapServers
              value: "kafka-0.kafka.data.svc.cluster.local:9092"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.data.svc.cluster.local:5432/ms_payments"
            - name: SPRING_DATASOURCE_USERNAME
              value: "ms_payments"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka.data.svc.cluster.local:9092"
            - name: JWT_ISSUER
              value: "https://auth.fixia.com"
            - name: JWT_AUDIENCE
              value: "https://api.fixia.com"
          envFrom:
            - secretRef:
                name: ms-payments-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-payments
  namespace: apps
  labels:
    app: ms-payments
spec:
  selector:
    app: ms-payments
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-payments
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "20"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: ms-payments
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ms-payments-metrics
  namespace: apps
  labels:
    app: ms-payments
spec:
  type: LoadBalancer
  selector:
    app: ms-payments
  ports:
    - name: metrics
      port: 9103
      targetPort: 8080
