name: ci
on:
  push:
    branches: [develop, Qa]
  pull_request:
    branches: [develop, Qa]

permissions:
  contents: read

jobs:
  # Pruebas xUnit de la solución .NET 8 (GC-496). Las de PostgreSQL (migraciones, xmin, Outbox con SKIP LOCKED,
  # idempotencia y retiros simultáneos) corren contra el servicio postgres de abajo vía FIXIA_PAYMENTS_TEST_PG.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixia
          POSTGRES_PASSWORD: fixia
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FIXIA_PAYMENTS_TEST_PG: Host=localhost;Port=5432;Username=fixia;Password=fixia;Database=postgres
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restaurar
        run: dotnet restore Fixia.Payments.sln
      - name: Compilar
        run: dotnet build Fixia.Payments.sln -c Release --no-restore
      - name: Pruebas
        run: >-
          dotnet test Fixia.Payments.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/Qa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
